theme = "mellow"

[editor]
line-number = "relative"
mouse = false
bufferline = "always"
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spacer", "version-control", "spacer", "file-name"]
right = ["diagnostics", "selections", "file-type", "file-encoding", "position-percentage", "separator", "position", "separator", "workspace-diagnostics"]

[editor.soft-wrap]
enable = true
max-indent-retain = 0
wrap-indicator = "↳ "

[editor.whitespace]
render = "all"
characters = {space = "·", nbsp = "⍽", tab = "→", newline = "⏎"}

[keys.normal]
"g" = {a = "code_action", t = "goto_type_definition"}
"C" = "toggle_comments"
"x" = "extend_line"
"tab" = "jump_view_right"
"S-tab" = "jump_view_left"
space = {space = "keep_primary_selection", F = "file_picker_in_current_buffer_directory", w = ":w", q = ":q", s = ":wq", n = ":bn", p = ":bp"}

[keys.insert]
"C-a" = "insert_at_line_start"
"C-e" = "insert_at_line_end"
"C-c" = "toggle_comments"

