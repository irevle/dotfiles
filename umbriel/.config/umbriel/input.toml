# Input
# Enable NumLock when a physical keyboard connects.
# https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
numlock_toggle = true

# Focus can follow the pointer across tiled, floating, and pinned windows.
# [input.focus]
# follows_mouse = true

# Confine touch input to one display.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

[input.touchpad]
tap = true
natural_scroll = true
left_handed = false
accel_profile = "flat"
sensitivity = 0.5
# scroll_factor = 1.5
disable_while_typing = true
disable_on_external_mouse = false
# click_method = "clickfinger"
# tap_button_map = "left_middle_right"

[input.mouse]
natural_scroll = false
left_handed = false
accel_profile = "flat"
sensitivity = 0.2
scroll_wheel_step = 60
