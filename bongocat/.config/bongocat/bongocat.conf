# ═══════════════════════════════════════════════════════════════════════════
# BONGO CAT CONFIG - Minimal defaults, uncomment to customize
# ═══════════════════════════════════════════════════════════════════════════

# Position & Size
cat_height=80
cat_align=right
cat_x_offset=0
cat_y_offset=13

# Appearance
overlay_height=65
overlay_opacity=0
overlay_position=bottom
# mirror_x=0
# mirror_y=0

# Input device (run bongocat-find-devices to find yours)
keyboard_name=AT Translated Set 2 keyboard
keyboard_name=BY Tech Gaming Keyboard

# Multi-monitor (comma-separated monitor names)
# monitor=eDP-1,HDMI-A-1

# Sleep mode (optional)
idle_sleep_timeout=60
# enable_scheduled_sleep=0
# sleep_begin=22:00
# sleep_end=06:00
